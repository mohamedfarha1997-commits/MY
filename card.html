<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B3594">
<title>بطاقة الهوية · RMY</title>
<style>
:root{--brand:#2B3594;--brand2:#0c1233;--ink:#14183a;--mut:#6b7090;--bg:#eef0f7;--card:#fff;--line:#e3e6f1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:380px}
.idc{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(12,18,51,.18)}
.top{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 20px 52px;position:relative}
.brand{display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.5px;font-size:18px}
.brand small{font-weight:400;opacity:.85;letter-spacing:0;font-size:13px}
.ava{position:absolute;right:20px;bottom:-40px;width:84px;height:84px;border-radius:50%;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.body{padding:54px 22px 22px}
.name{font-size:22px;font-weight:800;margin:0 0 14px;word-break:break-word}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.k{font-size:12px;color:var(--mut);margin-bottom:3px}
.v{font-weight:700;font-size:15px;text-align:right;unicode-bidi:plaintext}
.ltr{direction:ltr;unicode-bidi:plaintext}
.idbox{margin-top:16px;background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.idbox .v{font-size:20px;letter-spacing:1px;direction:ltr;text-align:center}
.center{text-align:center}
.role{color:var(--mut);font-size:14px;margin:0 0 14px}
.upd{text-align:center;font-size:12px;color:var(--mut);margin-top:14px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;direction:ltr;text-align:center;margin-top:6px}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.full{grid-column:1/-1}
.link{display:block;text-align:center;font-size:14px;color:var(--brand);margin-top:10px}
@media print{body{background:#fff;padding:0}.noprint{display:none}.idc{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<div class="wrap"><div id="out"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var DATA={cards:[],updated:null};
var currentCode='';
var out=document.getElementById('out');
var qid=new URLSearchParams(location.search).get('id')||(location.hash||'').slice(1);
var DATA_URL=new URL('cards.json',location.href).href;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').trim().toUpperCase();}
function findCard(id){return DATA.cards.filter(function(c){return norm(c.code)===norm(id);})[0]||null;}
function fmtDate(d){
  if(!d)return '';
  var t=new Date(d+'T00:00:00');
  return isNaN(t)?d:t.toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
}

function showCard(c){
  currentCode=c.code;
  var initial=String(c.name||c.code||'?').trim().charAt(0);
  var upd=DATA.updated?new Date(DATA.updated).toLocaleDateString('ar-EG'):'';
  var cells='';
  if(c.job)cells+='<div><div class="k">الوظيفة</div><div class="v">'+esc(c.job)+'</div></div>';
  if(c.joinDate)cells+='<div><div class="k">تاريخ الانضمام</div><div class="v">'+esc(fmtDate(c.joinDate))+'</div></div>';
  if(c.wa)cells+='<div class="full"><div class="k">واتساب</div><div class="v ltr">'+esc(c.wa)+'</div></div>';

  out.innerHTML='<div class="idc">'+
    '<div class="top"><div class="brand"><span>RMY</span><small>بطاقة هوية</small></div><div class="ava">'+esc(initial)+'</div></div>'+
    '<div class="body">'+(c.name?'<p class="name">'+esc(c.name)+'</p>':'')+
    (cells?'<div class="grid">'+cells+'</div>':'')+
    '<div class="idbox"><div class="k">رقم الـ ID (الكود)</div><div class="v">'+esc(c.code)+'</div></div>'+
    (upd?'<div class="upd">آخر تحديث: '+esc(upd)+'</div>':'')+
    '</div></div>'+
    '<div class="noprint"><button id="pdfBtn">تحميل PDF</button><button class="ghost" id="printBtn">طباعة</button>'+
    '<a class="link" href="card.html">تحقق من ID تاني</a></div>';
  document.getElementById('printBtn').onclick=function(){window.print();};
  document.getElementById('pdfBtn').onclick=downloadPdf;
}

function downloadPdf(){
  var el=document.querySelector('.idc');
  var btn=document.getElementById('pdfBtn');
  if(!el||!window.html2canvas||!window.jspdf){window.print();return;}
  btn.disabled=true;btn.textContent='جاري تجهيز الملف...';
  html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(function(canvas){
    var w=canvas.width/2, h=canvas.height/2, m=24;
    var pdf=new window.jspdf.jsPDF({unit:'px',format:[w+m*2,h+m*2],orientation:w>h?'l':'p'});
    pdf.addImage(canvas.toDataURL('image/png'),'PNG',m,m,w,h);
    pdf.save('ID-'+currentCode+'.pdf');
  }).catch(function(){
    window.print();
  }).then(function(){
    btn.disabled=false;btn.textContent='تحميل PDF';
  });
}

function askId(msg){
  out.innerHTML='<div class="idc"><div class="body">'+
    '<p class="name center">التحقق من بطاقة الـ ID</p>'+
    '<p class="role center">'+esc(msg||'اكتب رقم الـ ID (الكود) الموجود على الكارت')+'</p>'+
    '<input id="q" placeholder="الكود" autocomplete="off" autocapitalize="characters">'+
    '<button id="go">عرض البطاقة</button>'+
    '</div></div>';
  var q=document.getElementById('q');
  document.getElementById('go').onclick=function(){go(q.value);};
  q.onkeydown=function(e){if(e.key==='Enter')go(q.value);};
  q.focus();
}

function go(v){
  var c=findCard(v);
  if(!c){askId('الـ ID ده مش موجود، اتأكد منه وجرّب تاني');return;}
  history.replaceState(null,'','?id='+encodeURIComponent(c.code));
  showCard(c);
}

fetch(DATA_URL,{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(j){
    DATA.cards=j.cards||[];
    DATA.updated=j.updated||null;
    if(qid){
      var c=findCard(qid);
      if(c){showCard(c);return;}
      askId('الـ ID ده مش موجود، اتأكد منه وجرّب تاني');
      return;
    }
    askId();
  })
  .catch(function(err){
    out.innerHTML='<div class="idc"><div class="body center"><p class="name">تعذّر تحميل البيانات</p>'+
      '<p class="role">الملف المطلوب: <span class="ltr">'+esc(DATA_URL)+'</span></p>'+
      '<p class="role">السبب: '+esc(String(err&&err.message||'غير معروف'))+'</p>'+
      '<p class="role">اتأكد إن cards.json مرفوع في نفس المكان اللي فيه card.html، وإن تصدير الكروت اتعمل بعد آخر تعديل.</p></div></div>';
  });
</script>
</body>
</html>
