<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b22">
<title>RMY · Identification Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#070b22; --indigo:#2B3594; --indigo2:#1a2470; --gold:#e9c46a; --gold2:#b98b2e;
  --ink:#0b1030; --mut:#6b7090; --line:#e6e8f3; --paper:#ffffff;
  --sans:"Inter","Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ar:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--ar);color:#fff;
  background:
    radial-gradient(1200px 600px at 10% -10%,rgba(78,98,220,.35),transparent 60%),
    radial-gradient(900px 500px at 110% 110%,rgba(233,196,106,.12),transparent 60%),
    linear-gradient(180deg,#0b1038 0%,var(--navy) 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 18px;
}
body::before{ /* subtle dot texture */
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:22px 22px;
}
.stage{position:relative;width:100%;max-width:400px}

/* ---------- The card ---------- */
.idc{
  position:relative;overflow:hidden;border-radius:26px;color:#fff;
  background:linear-gradient(135deg,#2f3fb0 0%,var(--indigo) 38%,var(--indigo2) 72%,#0a1140 100%);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08) inset;
  padding:26px 26px 22px;
}
.idc::before{ /* diagonal light sheen */
  content:"";position:absolute;inset:-40% -20%;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);
}
.idc::after{ /* big faint monogram watermark */
  content:"RMY";position:absolute;left:-14px;bottom:-34px;font:800 170px/1 var(--sans);
  color:rgba(255,255,255,.05);letter-spacing:-6px;pointer-events:none;
}
.head{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.mark{display:flex;align-items:center;gap:10px}
.mark svg{width:38px;height:38px;border-radius:10px;flex:none}
.mark b{display:block;font:800 17px/1 var(--sans);letter-spacing:2px}
.mark small{display:block;font:500 9.5px/1.4 var(--sans);letter-spacing:2.2px;text-transform:uppercase;opacity:.7;margin-top:3px}
.tag{font:600 9.5px/1 var(--sans);letter-spacing:2px;text-transform:uppercase;padding:7px 10px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);white-space:nowrap}

.person{display:flex;align-items:center;gap:16px;margin-top:28px;position:relative;z-index:1}
.avatar{
  flex:none;width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font:800 30px/1 var(--sans);color:var(--ink);
  background:linear-gradient(135deg,#fff7de,var(--gold) 55%,var(--gold2));
  box-shadow:0 10px 24px -8px rgba(233,196,106,.6),0 0 0 3px rgba(255,255,255,.15);
}
.pname{font:800 24px/1.2 var(--ar);margin:0;word-break:break-word}
.plabel{font:600 9.5px/1 var(--sans);letter-spacing:2px;text-transform:uppercase;opacity:.65;margin-top:6px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;margin-top:26px;position:relative;z-index:1}
.field.full{grid-column:1/-1}
.field .k{font:600 9.5px/1.2 var(--sans);letter-spacing:1.8px;text-transform:uppercase;opacity:.6}
.field .v{font:700 15px/1.35 var(--ar);margin-top:5px;word-break:break-word}
.field .v.en{font-family:var(--sans);direction:ltr;text-align:right}

.idrow{
  margin-top:26px;position:relative;z-index:1;border-radius:16px;padding:14px 16px;
  background:rgba(7,11,34,.35);border:1px solid rgba(255,255,255,.12);
}
.idrow .k{font:600 9.5px/1 var(--sans);letter-spacing:2px;text-transform:uppercase;opacity:.6;display:flex;justify-content:space-between}
.idrow .num{font:700 22px/1 var(--mono);letter-spacing:2px;margin-top:10px;direction:ltr;text-align:left}
.scratch{position:relative;margin-top:14px;height:64px;border-radius:12px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18)}
.scratch .num{font:700 22px/1 var(--mono);letter-spacing:3px;direction:ltr;text-align:center;position:relative;z-index:0}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;z-index:1}
.wm{position:absolute;inset:0;pointer-events:none;z-index:0;background-repeat:repeat;background-size:170px 96px}
.st{font:600 10px/1 var(--sans);letter-spacing:1.6px;text-transform:uppercase;display:inline-flex;align-items:center}
.st::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.7)}
.st.off::before{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.7)}
.barcode{
  height:30px;margin-top:12px;border-radius:4px;opacity:.85;
  background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 8px,#fff 8px 11px,transparent 11px 13px,#fff 13px 14px,transparent 14px 18px);
}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;position:relative;z-index:1;
  font:500 10px/1 var(--sans);letter-spacing:1.4px;text-transform:uppercase;opacity:.55}

/* ---------- Actions ---------- */
.actions{display:flex;gap:10px;margin-top:18px}
.btn{
  flex:1;appearance:none;border:0;cursor:pointer;border-radius:14px;padding:14px 16px;
  font:700 15px/1 var(--ar);color:var(--ink);
  background:linear-gradient(135deg,#fff7de,var(--gold) 60%,var(--gold2));
  box-shadow:0 12px 30px -12px rgba(233,196,106,.55);transition:transform .15s ease,filter .15s ease;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.ghost{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:none}
.linkline{display:block;text-align:center;margin-top:16px;font:500 13px/1 var(--ar);color:rgba(255,255,255,.7);text-decoration:none}
.linkline:hover{color:#fff}
.updated{text-align:center;margin-top:12px;font:500 11px/1 var(--sans);letter-spacing:1px;color:rgba(255,255,255,.45);text-transform:uppercase}

/* ---------- Lookup / error screens ---------- */
.panel{
  border-radius:26px;padding:34px 26px;text-align:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.55);
}
.panel .ico{
  width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fff7de,var(--gold) 60%,var(--gold2));color:var(--ink);font:800 26px/1 var(--sans);
}
.panel h2{font:800 22px/1.3 var(--ar);margin:0 0 8px}
.panel p{font:400 14px/1.7 var(--ar);color:rgba(255,255,255,.7);margin:0 0 10px}
.panel code{font:500 12px/1.4 var(--mono);direction:ltr;display:inline-block;background:rgba(0,0,0,.25);padding:4px 8px;border-radius:8px;word-break:break-all;color:#fff}
.input{
  width:100%;margin-top:14px;padding:15px 16px;border-radius:14px;font:700 18px/1 var(--mono);letter-spacing:1.5px;
  direction:ltr;text-align:center;color:#fff;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.18);outline:none;
}
.input:focus{border-color:var(--gold)}
.input::placeholder{color:rgba(255,255,255,.35);letter-spacing:1px;font-weight:500}
.err{color:#ffb4b4 !important;font-weight:600}

.loading{font:500 14px/1 var(--ar);color:rgba(255,255,255,.75);text-align:center;padding:60px 0}
.loading span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);margin:0 4px;animation:pulse 1.1s infinite ease-in-out}
.loading span:nth-child(2){animation-delay:.15s}.loading span:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

@media print{
  body{background:#fff;padding:0}
  body::before{display:none}
  .noprint{display:none !important}
  .idc{box-shadow:none;border:1px solid #cfd3e6}
  .scratch canvas{display:none}
}
</style>
</head>
<body>
<div class="stage"><div id="out"><div class="loading"><span></span><span></span><span></span></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var DATA={cards:[],updated:null};
var currentCode='';
var out=document.getElementById('out');
var qid=new URLSearchParams(location.search).get('id')||(location.hash||'').slice(1);
var DATA_URL=new URL('cards.json',location.href).href;
var LOGO='<svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="110" fill="#ffffff" fill-opacity=".14"/><g fill="#fff" fill-rule="evenodd"><path d="M87 215 H150 Q185 215 185 245 Q185 268 165 275 L185 297 H160 L140 277 H108 V297 H87 Z M108 236 V256 H150 Q163 256 163 246 Q163 236 150 236 Z"/><path d="M195 215 H222 L250 262 L278 215 H305 V297 H283 V248 L258 288 H242 L217 248 V297 H195 Z"/><path d="M308 215 H333 L364 254 L395 215 H422 L380 270 V297 H355 V270 Z"/></g></svg>';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').trim().toUpperCase();}
function findCard(id){return DATA.cards.filter(function(c){return norm(c.code)===norm(id);})[0]||null;}
function fmtDate(d){
  if(!d)return '';
  var t=new Date(d+'T00:00:00');
  return isNaN(t)?d:t.toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
}

function showCard(c){
  currentCode=c.code;
  var initial=String(c.name||c.code||'?').trim().charAt(0).toUpperCase();
  var upd=DATA.updated?new Date(DATA.updated).toLocaleDateString('ar-EG'):'';
  var fields='';
  if(c.name)fields+='<div class="field full"><div class="k">Full name · الاسم</div><div class="v">'+esc(c.name)+'</div></div>';
  if(c.job)fields+='<div class="field"><div class="k">Position · الوظيفة</div><div class="v">'+esc(c.job)+'</div></div>';
  if(c.joinDate)fields+='<div class="field"><div class="k">Joined · الانضمام</div><div class="v">'+esc(fmtDate(c.joinDate))+'</div></div>';
  if(c.wa)fields+='<div class="field full"><div class="k">WhatsApp · واتساب</div><div class="v en">'+esc(c.wa)+'</div></div>';

  var act=c.active!==false;
  var wmSvg='<svg xmlns="http://www.w3.org/2000/svg" width="170" height="96"><text x="85" y="58" transform="rotate(-22 85 48)" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="15" letter-spacing="2" fill="#ffffff" fill-opacity="0.07">RMY Pro</text></svg>';
  var wm='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(wmSvg);
  out.innerHTML='<div class="idc" id="card"><div class="wm" aria-hidden="true" style="background-image:url(\''+wm+'\')"></div>'+
    '<div class="head">'+
      '<div class="mark">'+LOGO+'<div><b>RMY</b><small>Identification</small></div></div>'+
      '<span class="tag">Verified</span>'+
    '</div>'+
    '<div class="person"><div class="avatar">'+esc(initial)+'</div>'+
      '<div><p class="pname">'+esc(c.name||c.code)+'</p><div class="plabel">Member · عضو</div></div>'+
    '</div>'+
    (fields?'<div class="fields">'+fields+'</div>':'')+
    '<div class="idrow"><div class="k"><span>Employee ID · رقم الـ ID</span><span class="st '+(act?'':'off')+'">'+(act?'Active':'Inactive')+'</span></div>'+
      '<div class="scratch"><span class="num">'+esc(c.code)+'</span><canvas id="scratchC" aria-label="اخربش لكشف الـ ID"></canvas></div>'+
      '<div class="barcode" aria-hidden="true"></div>'+
    '</div>'+
    '<div class="foot"><span>RMY Pro</span>'+(upd?'<span>Updated · '+esc(upd)+'</span>':'')+'</div>'+
  '</div>'+
  '<div class="noprint actions"><button class="btn" id="pdfBtn">تحميل PDF</button><button class="btn ghost" id="printBtn">طباعة</button></div>'+
  '<a class="linkline noprint" href="card.html">تحقق من ID تاني</a>';

  document.getElementById('printBtn').onclick=function(){window.print();};
  document.getElementById('pdfBtn').onclick=downloadPdf;
  initScratch();
}

/* طبقة فضية تتمسح بالإيد أو الماوس، ولما أغلب المساحة تتمسح بتختفي خالص */
function initScratch(){
  var cv=document.getElementById('scratchC');
  if(!cv||!cv.getContext)return;
  var box=cv.parentNode,w=box.offsetWidth,h=box.offsetHeight,dpr=window.devicePixelRatio||1;
  if(!w||!h)return;
  cv.width=w*dpr;cv.height=h*dpr;
  var ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  var g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#d9dce6');g.addColorStop(.5,'#f7f8fc');g.addColorStop(1,'#b7bdcf');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  /* حبيبات الفويل */
  for(var k=0;k<w*h/9;k++){
    ctx.fillStyle=Math.random()<.5?'rgba(255,255,255,.5)':'rgba(90,100,130,.12)';
    ctx.fillRect(Math.random()*w,Math.random()*h,1,1);
  }
  /* كلمة خفيفة وباهتة */
  ctx.fillStyle='rgba(11,16,48,.3)';
  ctx.font='400 11px Tajawal, Tahoma, sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('خربش هنا',w/2,h/2);
  ctx.globalCompositeOperation='destination-out';
  ctx.lineCap='round';ctx.lineJoin='round';

  var drawing=false,last=null,done=false;
  function pt(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  function scratchTo(p){
    var from=last||p;
    var dist=Math.hypot(p.x-from.x,p.y-from.y);
    var steps=Math.max(1,Math.ceil(dist/3));
    for(var s=1;s<=steps;s++){
      var t=s/steps,x=from.x+(p.x-from.x)*t,y=from.y+(p.y-from.y)*t;
      /* خط متقطع بعرض متغيّر عشان يبان زي الخربشة الحقيقية */
      ctx.beginPath();
      ctx.lineWidth=8+Math.random()*10;
      ctx.moveTo(x+(Math.random()-.5)*3,y+(Math.random()-.5)*3);
      ctx.lineTo(x+(Math.random()-.5)*3,y+(Math.random()-.5)*3);
      ctx.stroke();
      /* قشور صغيرة بتتشال حوالين الخط */
      if(Math.random()<.3){
        ctx.beginPath();
        ctx.arc(x+(Math.random()-.5)*20,y+(Math.random()-.5)*14,Math.random()*1.8+.4,0,Math.PI*2);
        ctx.fill();
      }
    }
    last=p;
  }
  function checkDone(){
    if(done)return;
    var d=ctx.getImageData(0,0,cv.width,cv.height).data,n=0,t=0;
    for(var i=3;i<d.length;i+=32){t++;if(d[i]<128)n++;}
    if(t&&n/t>0.5){done=true;cv.remove();}
  }
  cv.addEventListener('pointerdown',function(e){
    if(done)return;
    drawing=true;last=null;
    if(cv.setPointerCapture)cv.setPointerCapture(e.pointerId);
    scratchTo(pt(e));
    e.preventDefault();
  });
  cv.addEventListener('pointermove',function(e){
    if(!drawing||done)return;
    scratchTo(pt(e));
  });
  function end(){
    if(!drawing)return;
    drawing=false;last=null;
    checkDone();
  }
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',end);
}

function downloadPdf(){
  var el=document.getElementById('card');
  var btn=document.getElementById('pdfBtn');
  if(!el||!window.html2canvas||!window.jspdf){window.print();return;}
  btn.disabled=true;btn.textContent='جاري تجهيز الملف...';
  html2canvas(el,{scale:2,backgroundColor:null,useCORS:true}).then(function(canvas){
    var w=canvas.width/2, h=canvas.height/2, m=24;
    var pdf=new window.jspdf.jsPDF({unit:'px',format:[w+m*2,h+m*2],orientation:w>h?'l':'p'});
    pdf.setFillColor(7,11,34);
    pdf.rect(0,0,w+m*2,h+m*2,'F');
    pdf.addImage(canvas.toDataURL('image/png'),'PNG',m,m,w,h);
    pdf.save('ID-'+currentCode+'.pdf');
  }).catch(function(){
    window.print();
  }).then(function(){
    btn.disabled=false;btn.textContent='تحميل PDF';
  });
}

function askId(msg){
  out.innerHTML='<div class="panel">'+
    '<div class="ico">ID</div>'+
    '<h2>التحقق من البطاقة</h2>'+
    '<p class="'+(msg&&msg.indexOf('مش موجود')>-1?'err':'')+'">'+esc(msg||'اكتب رقم الـ ID الموجود على الكارت')+'</p>'+
    '<input class="input" id="q" placeholder="CODE" autocomplete="off" autocapitalize="characters">'+
    '<div class="actions" style="margin-top:14px"><button class="btn" id="go">عرض البطاقة</button></div>'+
  '</div>';
  var q=document.getElementById('q');
  document.getElementById('go').onclick=function(){go(q.value);};
  q.onkeydown=function(e){if(e.key==='Enter')go(q.value);};
  q.focus();
}

function go(v){
  var c=findCard(v);
  if(!c){askId('الـ ID ده مش موجود، اتأكد منه وجرّب تاني');return;}
  history.replaceState(null,'','?id='+encodeURIComponent(c.code));
  showCard(c);
}

fetch(DATA_URL,{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(j){
    DATA.cards=j.cards||[];
    DATA.updated=j.updated||null;
    if(qid){
      var c=findCard(qid);
      if(c){showCard(c);return;}
      askId('الـ ID ده مش موجود، اتأكد منه وجرّب تاني');
      return;
    }
    askId();
  })
  .catch(function(err){
    out.innerHTML='<div class="panel"><div class="ico">!</div>'+
      '<h2>تعذّر تحميل البيانات</h2>'+
      '<p>الملف المطلوب:</p><code>'+esc(DATA_URL)+'</code>'+
      '<p style="margin-top:14px">السبب: '+esc(String(err&&err.message||'غير معروف'))+'</p>'+
      '<p>اتأكد إن cards.json مرفوع في نفس المكان اللي فيه card.html، وإن تصدير الكروت اتعمل بعد آخر تعديل.</p>'+
    '</div>';
  });
</script>
</body>
</html>
