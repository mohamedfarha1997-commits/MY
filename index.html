.bcmeta{font-size:12px;opacity:.7;margin:6px 0 4px}
.bcitem{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--surface)}
.bcn{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font-size:15px;box-sizing:border-box}
.bcline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.bcl{font-size:12px;opacity:.7}
.bcqs{display:flex;align-items:center;gap:6px}
.bcq{width:76px;height:36px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:700;box-sizing:border-box}
.bcname{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font-size:16px;font-weight:800;box-sizing:border-box}
.bcadd{margin-top:8px;width:100%}
.bcfoot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.bcdanger{color:#c0392b !important;border-color:#c0392b !important}
.bctbl{width:100%;border-collapse:collapse;color:var(--ink)}
.bctbl th,.bctbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
.bctbl th{font-size:13px;opacity:.7;font-weight:600}
.bctbl td:last-child{text-align:left;font-weight:800;font-size:15px}
