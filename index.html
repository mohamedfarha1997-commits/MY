<script>
(function(){
'use strict';
var KEY='khat-entaj-v1';
var AUTH_KEY='khat-entaj-auth';
var AUTH_SALT='4aaffca52d441df9997bc8958e7eb2c3',AUTH_HASH='dd4bb609652f9c98e79ea62b15f043fdd22e4306703aa4a10394808fce3aef70',AUTH_ITER=200000;
async function checkPin(p){
  var enc=new TextEncoder();
  var key=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(AUTH_SALT),iterations:AUTH_ITER,hash:'SHA-256'},key,256);
  var hex=Array.from(new Uint8Array(bits)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  return hex===AUTH_HASH;
}
function authed(){try{return sessionStorage.getItem(AUTH_KEY)==='1';}catch(e){return false;}}
var FS={h:null,ok:false,at:0,err:null,q:Promise.resolve(),wroteAt:0,busy:false};
function fsSupported(){return typeof window.showDirectoryPicker==='function'&&typeof indexedDB!=='undefined';}
function devId(){try{var d=localStorage.getItem('khat-dev');if(!d){d=Math.random().toString(36).slice(2,8);localStorage.setItem('khat-dev',d);}return d;}catch(e){return 'dev';}}
function fsDayPrefix(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return 'khat-entaj-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function fsDayName(){return fsDayPrefix()+'-'+devId()+'.json';}
function idbOpen(){return new Promise(function(res,rej){var r=indexedDB.open('khat-entaj-fs',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbGet(k){return idbOpen().then(function(db){return new Promise(function(res,rej){var q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});});}
function idbSet(k,v){return idbOpen().then(function(db){return new Promise(function(res,rej){var t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=function(){res();};t.onerror=function(){rej(t.error);};});});}
function fsLoad(){
  if(!fsSupported())return;
  idbGet('dirhandle').then(function(h){
    if(!h)return;FS.h=h;
    return h.queryPermission({mode:'readwrite'}).then(function(p){FS.ok=p==='granted';});
  }).then(function(){if(FS.h){render();fsArm();}return syncFromFolder();}).catch(function(){});
}
function fsArm(){
  if(!FS.h||FS.ok||FS.armed)return;FS.armed=true;
  document.addEventListener('pointerdown',function h(){
    if(!authed())return;
    document.removeEventListener('pointerdown',h,true);FS.armed=false;
    if(!FS.ok)ACT.fsGrant({});
  },true);
}
var RECIPE_FILE='khat-entaj-recipes.json';
function fsWrite(){
  if(!FS.h||!FS.ok)return;
  var dayData={};for(var k in S)if(k!=='products'&&k!=='materials')dayData[k]=S[k];
  var stamp=S.savedAt||0;
  var body=JSON.stringify({app:'khat-entaj',v:1,exported:new Date().toISOString(),data:dayData},null,1);
  FS.q=FS.q.then(function(){
    return FS.h.getFileHandle(fsDayName(),{create:true}).then(function(fh){return fh.createWritable();}).then(function(w){return w.write(body).then(function(){return w.close();});});
  }).then(function(){FS.at=Date.now();FS.err=null;FS.wroteAt=stamp;}).catch(function(){FS.err='تعذّر الحفظ في الملف، اتأكد إن الملف مش مفتوح في برنامج تاني';});
}
function fsWriteRecipes(){
  S.recipesAt=Date.now();
  if(!FS.h||!FS.ok)return;
  var body=JSON.stringify({app:'khat-entaj',kind:'recipes',v:1,exported:new Date().toISOString(),data:{products:S.products,materials:S.materials,at:S.recipesAt}},null,1);
  FS.q=FS.q.then(function(){
    return FS.h.getFileHandle(RECIPE_FILE,{create:true}).then(function(fh){return fh.createWritable();}).then(function(w){return w.write(body).then(function(){return w.close();});});
  }).catch(function(){FS.err='تعذّر حفظ ملف الوصفات';});
}
function fsReadRecipes(){
  if(!FS.h||!FS.ok)return Promise.resolve(null);
  return FS.h.getFileHandle(RECIPE_FILE).then(function(fh){return fh.getFile();}).then(function(f){return f.text();})
    .then(function(t){var j=JSON.parse(t);return j&&j.data&&Array.isArray(j.data.products)?j.data:null;}).catch(function(){return null;});
}
var TOMB_KEYS=['orders','batches','done','stock','ready','seq','oseq','locks','tomb','track'];
function tombAdd(kind,id){S.tomb=S.tomb||{orders:[],batches:[]};if(S.tomb[kind].indexOf(id)<0)S.tomb[kind].push(id);}
function fsReadDayFiles(){
  var out=[],prefix=fsDayPrefix();
  var it=FS.h.values();
  function next(){
    return it.next().then(function(r){
      if(r.done)return out;
      var h=r.value,rest=h.name.slice(prefix.length);
      if(h.kind==='file'&&h.name.indexOf(prefix)===0&&/^[-.]/.test(rest)&&/\.json$/.test(h.name)){
        return h.getFile().then(function(f){return f.text();}).then(function(t){var j=JSON.parse(t);if(j&&j.data)out.push(j.data);}).catch(function(){}).then(next);
      }
      return next();
    });
  }
  return next().catch(function(){return out;});
}
function localDaySnapshot(){var d={};for(var k in S)if(k!=='products'&&k!=='materials')d[k]=S[k];return d;}
function mergeDays(list){
  var base=list.slice().sort(function(x,y){return (x.savedAt||0)-(y.savedAt||0);});
  var M={},tomb={orders:{},batches:{}};
  base.forEach(function(d){
    for(var k in d){if(k!=='orders'&&k!=='batches'&&k!=='done'&&k!=='products'&&k!=='materials'&&k!=='tomb')M[k]=d[k];}
    ((d.tomb&&d.tomb.orders)||[]).forEach(function(i){tomb.orders[i]=1;});
    ((d.tomb&&d.tomb.batches)||[]).forEach(function(i){tomb.batches[i]=1;});
  });
  M.tomb={orders:Object.keys(tomb.orders),batches:Object.keys(tomb.batches)};
  function union(key,dead){
    var map={},order=[];
    base.forEach(function(d){(d[key]||[]).forEach(function(r){
      if(dead[r.id])return;
      if(!map[r.id]){order.push(r.id);}
      map[r.id]=r;
    });});
    return order.map(function(id){return map[id];});
  }
  M.orders=union('orders',tomb.orders).map(function(o){
    var any=base.filter(function(d){return (d.orders||[]).some(function(x){return x.id===o.id&&x.deliveredAt;});})[0];
    if(any&&!o.deliveredAt){o=Object.assign({},o,{deliveredAt:any.orders.filter(function(x){return x.id===o.id;})[0].deliveredAt});}
    return o;
  });
  M.batches=union('batches',tomb.batches);
  M.done=union('done',{});
  M.savedAt=Math.max.apply(null,[0].concat(base.map(function(d){return d.savedAt||0;})));
  return M;
}
function syncFromFolder(){
  if(!FS.h||!FS.ok)return Promise.resolve();
  return Promise.all([fsReadDayFiles(),fsReadRecipes()]).then(function(res){
    var list=res[0].concat([localDaySnapshot()]),rec=res[1],changed=false;
    var M=mergeDays(list);
    var pick=function(d){var o={};TOMB_KEYS.forEach(function(k){o[k]=d[k];});return JSON.stringify(o);};
    if(pick(M)!==pick(localDaySnapshot())){
      TOMB_KEYS.forEach(function(k){if(M[k]!==undefined)S[k]=M[k];});
      S.orders=M.orders;S.batches=M.batches;S.done=M.done;S.savedAt=M.savedAt;
      changed=true;
    }
    var localN=(S.products||[]).length,fileN=rec?rec.products.length:0;
    FS.recN=fileN;FS.localN=localN;
    if(rec&&fileN&&((rec.at||0)>(S.recipesAt||0)||!localN)){
      S.products=rec.products;S.materials=rec.materials;S.recipesAt=rec.at;changed=true;
    }else if(localN&&(!rec||(S.recipesAt||0)>(rec.at||0))){
      fsWriteRecipes();
    }
    if(changed){
      migrateProducts(S.products);bind(S);FS.wroteAt=S.savedAt||0;
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      if(!(U.sheet||U.form||U.osheet||U.recv||isTyping()))render();
    }
  });
}
function connOn(){return fsSupported()&&!!FS.h&&FS.ok&&!FS.err;}
function connBadge(){
  if(connOn())return '<span class="pill ok">محفوظ في الفولدر</span>';
  if(fsSupported()&&FS.h&&!FS.ok)return '<span class="pill low" data-act="fsGrant" style="cursor:pointer">اضغط لتفعيل الحفظ في الفولدر</span>';
  return '<span class="pill ok">محفوظ على الجهاز</span>';
}
function canWrite(){return true;}
function offNote(){return '';}
function updateConn(){
  var el=document.getElementById('connBadge');if(el)el.innerHTML=connBadge();
  var ob=document.getElementById('offBanner');if(ob)ob.innerHTML=offNote();
}
function isTyping(){var a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));}
window.addEventListener('online',function(){updateConn();});
window.addEventListener('offline',function(){updateConn();});
function fsTick(){
  if(!FS.h||!FS.ok||FS.busy)return;
  FS.busy=true;
  if(FS.err){FS.err=null;FS.wroteAt=-1;}
  syncFromFolder().catch(function(){}).then(function(){
    if((S.savedAt||0)>FS.wroteAt)fsWrite();
    return FS.q;
  }).catch(function(){}).then(function(){FS.busy=false;updateConn();});
}
function fileSaveHTML(){
  var st,btn;
  if(!fsSupported()){
    st='<span class="pill bad">المتصفح مش بيدعم</span>';
    btn='<div class="meta">البيانات محفوظة على الجهاز نفسه. الحفظ في فولدر على الكمبيوتر بيشتغل من Chrome أو Edge على الكمبيوتر بس، وعلى الموبايل استخدم النسخة الاحتياطية اليدوية.</div>';
  }else if(!FS.h){
    st='<span class="pill low">مفيش ملف</span>';
    btn='<button class="btn sm" data-act="fsPick">اختار الفولدر</button><div class="meta">جوه الفولدر هيتعمل ملف لكل يوم باسم khat-entaj-YYYY-MM-DD.json فيه شغل اليوم ده، وملف ثابت للوصفات والخامات باسم khat-entaj-recipes.json. ملف الوصفات بيتحدّث بس لما تحفظ وصفة أو خامة أو تمسحها، فمفيش تغيير بيحصل عليه بالغلط.</div>';
  }else if(!FS.ok){
    st='<span class="pill low">محتاج صلاحية</span>';
    btn='<button class="btn sm" data-act="fsGrant">امنح صلاحية الحفظ</button><div class="meta">الملف: <span class="ltr">'+FS.h.name+'</span>. ده بيتعمل بضغطة بعد كل مرة تفتح فيها الصفحة.</div>';
  }else{
    st='<span class="pill ok">بيحفظ ويزامن كل ثانية</span>';
    btn='<div class="meta">الملف: <span class="ltr">'+FS.h.name+'</span>'+(FS.at?' · آخر حفظ '+bkAgo(FS.at):'')+'</div>'+(FS.recN!==undefined?'<div class="meta">الوصفات في الفولدر: '+FS.recN+' · على الجهاز: '+FS.localN+'</div>':'')+'<div class="acts"><button class="btn ghost sm" data-act="fsSync">زامن الآن</button><button class="btn ghost sm" data-act="fsPick">غيّر الفولدر</button></div>';
  }
  return '<section class="card dat" style="--c:var(--stock)"><div class="row"><h3>فولدر الحفظ التلقائي</h3>'+st+'</div>'+(FS.err?'<div class="note">'+FS.err+'</div>':'')+btn+'</section>';
}

function svg(k,cls){return '<svg viewBox="0 0 24 24" aria-hidden="true"'+(cls?' class="'+cls+'"':'')+'>'+IC[k]+'</svg>';}

var QC=['الطعم','درجة الحرارة','شكل التقديم','التغليف'];
var MATERIALS=[],PRODUCTS=[];
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function unesc(s){return String(s==null?'':s).replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&');}
function dstr(days){return new Date(Date.now()+days*86400000).toISOString().slice(0,10);}
function bind(s){MATERIALS=s.materials;PRODUCTS=s.products;}
function fix(o){
  if(!o.materials)o.materials=[];
  if(!o.products)o.products=[];
  migrateProducts(o.products);
  if(!o.ready)o.ready={};
  if(!o.orders)o.orders=[];
  if(!o.locks)o.locks={};
  o.orders.forEach(function(x){if(!x.kind)x.kind=(x.cust==='للمحل')?'shop':'cust';});
  if(!o.fgMig){o.fgMig=1;
    o.orders.forEach(function(x){
      if(x.deliveredAt)return;
      (x.items||[]).forEach(function(it){
        it.fs=it.fs||0;it.got=it.got||0;
        var g=0;(o.done||[]).forEach(function(d){if(d.o===x.id&&d.p===it.p)g+=d.good||0;});
        var av=o.ready[it.p]||0,mv=Math.min(g,av);
        if(mv>0){it.got=mv;o.ready[it.p]=av-mv;}
      });
    });
  }
  Object.keys(o.locks).forEach(function(k){if(k.indexOf('|')<0){o.locks['cust|'+k]=o.locks[k];delete o.locks[k];}});
  if(!o.oseq)o.oseq=o.orders.length;
  bind(o);return o;
}
var UNITS_M=['كجم','جرام','لتر','قطعة','علبة','كيس','بيضة'];
var UNITS_P=['صاج','سندويش كبير','سندويش صغير','كاس','فورمة كبيرة','فورمة مربعة صغيرة','قطعة','كوب','طبق','علبة'];
var STORES=['مخزن جاف','ثلاجة','فريزر'];

var nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
function f(n){return nf.format(n);}
function P(id){return PRODUCTS.filter(function(p){return p.id===id;})[0];}
function M(id){return MATERIALS.filter(function(m){return m.id===id;})[0];}
function r3(x){return Math.round(x*1000)/1000;}
function num(s){
  var map={'٠':0,'١':1,'٢':2,'٣':3,'٤':4,'٥':5,'٦':6,'٧':7,'٨':8,'٩':9};
  s=String(s).replace(/[٠-٩]/g,function(d){return map[d];}).replace(/[٫,]/g,'.').trim();
  var v=parseFloat(s);return isFinite(v)?v:NaN;
}

var S=load();
var U={view:'home',sheet:null,recv:null,filter:'all',confirm:null};
var h=(location.hash||'').slice(1);
if(['home','orders','shopOrders','shopProducts','recipes','settings','prep','prod','stock','finish','fgstock'].indexOf(h)>-1)U.view=h;

function need(b){var o={},r=P(b.p).recipe;for(var k in r)o[k]=r3(r[k]*b.qty);return o;}
function shortOf(b){var n=need(b),out=[];if(!TRACK())return out;for(var k in n){var have=S.stock[k]||0;if(have+1e-9<n[k])out.push({k:k,lack:n[k]-have});}return out;}
function applyWithdraw(s,b){var n=need(b);if(s.track===true){for(var k in n)s.stock[k]=r3((s.stock[k]||0)-n[k]);}b.withdrawn=true;b.drawn=s.track===true?n:{};}
function TRACK(){return !!S&&S.track===true;}
function isLow(m){return TRACK()&&(S.stock[m.id]||0)<m.min;}
function reserved(mid){
  var t=0;S.batches.forEach(function(b){if(b.stage==='prep'&&!b.withdrawn){t+=need(b)[mid]||0;}});return t;
}
function dur(b){return P(b.p).mins*60000;}
function elapsed(b){return b.startedAt?Math.min(dur(b),Date.now()-b.startedAt):0;}
function timerDone(b){return !!b.startedAt&&Date.now()-b.startedAt>=dur(b);}
function mmss(ms){var s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function ago(ts){var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'الآن';if(m<60)return 'منذ '+m+' د';return 'منذ '+Math.floor(m/60)+' س';}
function batch(id){return S.batches.filter(function(b){return b.id===id;})[0];}

function seed(){
  var s={stock:{},batches:[],done:[],ready:{},orders:[],oseq:0,seq:100,demo:false,materials:[],products:[],locks:{}};
  bind(s);return s;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.stock&&o.batches)return fix(o);}}catch(e){}
  return seed();
}
function save(){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}fsWrite();}

  var total=S.done.reduce(function(a,d){return a+d.good;},0);

function navItems(){
  var by=function(st){return S.batches.filter(function(b){return b.stage===st;});};
  var low=MATERIALS.filter(isLow).length;
  var running=by('prod').some(function(b){return b.startedAt&&!timerDone(b);});
  var st=[
    {k:'orders',l:'أوردرات',n:openCount('cust'),u:'طلبية',g:'orders'},{k:'shopOrders',l:'أوردرات المحل',n:openCount('shop'),u:'طلبية',g:'orders'},
    {k:'prep',l:'تحضير',n:by('prep').length,u:'دفعة'},
    {k:'prod',l:'إنتاج',n:by('prod').length,u:'دفعة',live:running},
    {k:'stock',l:'خامات',n:low,u:'ناقص',warn:low>0},
    {k:'finish',l:'فنش',n:by('finish').length,u:'للفحص'},{k:'fgstock',l:'مخزن الإنتاج',n:fgShortCount(),u:'ناقص',warn:fgShortCount()>0}
  ];
  st.push({k:'recipes',l:'وصفات',n:PRODUCTS.length,u:'وصفة',g:'recipes'});
  st.push({k:'shopProducts',l:'وصفات المحل',n:prodsOf('shop').length,u:'وصفة',g:'recipes'});
  return st;
}
var GROUP_LABEL={orders:'الأوردرات',recipes:'الوصفات'};
function navTab(s){
  return '<button class="tab'+(U.view===s.k?' on':'')+(s.k==='finish'||s.k==='recipes'?' noarr':'')+'" style="--c:var(--'+(s.k==='shopOrders'?'orders':s.k==='shopProducts'?'recipes':s.k==='fgstock'?'stock':s.k)+')" data-act="tab" data-v="'+s.k+'"'+(U.view===s.k?' aria-current="page"':'')+'>'+
    (s.live?'<i class="live" title="قيد التشغيل"></i>':'')+svg(s.k)+'<span class="tl">'+s.l+'</span><span class="cnt'+(s.warn?' warn':'')+'">'+s.n+'</span><small>'+s.u+'</small></button>';
}
function navHTML(){
  var st=navItems().filter(function(x){return !tabHidden(x.k);});
  var out='',i=0;
  while(i<st.length){
    var g=st[i].g;
    if(!g){out+=navTab(st[i]);i++;continue;}
    var inner='';
    while(i<st.length&&st[i].g===g){inner+=navTab(st[i]);i++;}
    out+='<div class="ngrp"><span class="glab">'+GROUP_LABEL[g]+'</span><div class="gin">'+inner+'</div></div>';
  }
  return '<nav class="nav" aria-label="مراحل الإنتاج">'+out+'</nav>';
}

}
function head(t,sub,btn){
  return '<div class="sh"><div><h2>'+t+'</h2><p>'+sub+'</p></div>'+(btn||'')+'</div>';
}

function prepCard(b){
  var p=P(b.p),n=need(b),sh=shortOf(b),shk={};
  sh.forEach(function(s){shk[s.k]=s.lack;});
  var rows=Object.keys(n).map(function(k){
    var m=M(k),have=S.stock[k]||0,st;
    if(b.withdrawn)st='<span class="pill ok">'+svg('check','mi')+' مسحوب</span>';
    else if(shk[k])st='<span class="pill bad">ينقص '+f(shk[k])+'</span>';
    else st=TRACK()?'<span class="pill ok">متوفر</span>':'';
    return '<div class="rq"><div><b>'+m.name+'</b>'+(b.withdrawn||!TRACK()?'':'<small>المتاح '+f(have)+' '+m.unit+'</small>')+'</div><span class="qv">'+f(n[k])+' '+m.unit+'</span>'+st+'</div>';
  }).join('');
  var act='';
  if(!b.withdrawn){
    if(sh.length){
      act='<div class="note">ينقص '+sh.length+(sh.length>2?' أصناف':' صنف')+' في المخزن. استلمها الأول وبعدها اسحب.</div><button class="btn block" data-act="goStock">افتح المخزن</button>';
    }else{
      act='<button class="btn block" data-act="withdraw" data-id="'+b.id+'">'+(TRACK()?'اسحب المواد من المخزن':'تأكيد تجهيز الخامات')+'</button>';
    }
  }else{
    var ck=b.checks||[],tot=prepItems(p,b.qty).length;
    act='<div class="prog"><span>خطوات التجهيز '+ck.length+'/'+tot+'</span><div class="bar"><i style="width:'+(ck.length/tot*100)+'%"></i></div></div>'+
      prepGroupsHTML(b)+
      '<button class="btn block" data-act="toProd" data-id="'+b.id+'"'+(ck.length<tot?' disabled':'')+'>حوّل للإنتاج</button>';
  }
  return '<article class="card"><div class="bh"><div><span class="bid ltr">'+b.id+'</span><h3 class="bn">'+p.name+' · '+f(b.qty)+' '+p.unit+'</h3><span class="meta">أُنشئت '+ago(b.created)+'</span>'+(b.o?'<div>'+otag(b)+'</div>':'')+'</div>'+
    '<span class="pill '+(b.withdrawn?'c':'low')+'">'+(b.withdrawn?'قيد التجهيز':'بانتظار السحب')+'</span></div>'+
    '<div>'+rows+'</div>'+act+
    '<div class="foot"><span class="meta">'+p.mins+' دقيقة تشغيل</span><button class="btn quiet" data-act="cancel" data-id="'+b.id+'">'+(U.confirm===b.id?'اضغط تاني للتأكيد':'إلغاء الدفعة')+'</button></div></article>';
}
function prepView(){
  var list=S.batches.filter(function(b){return b.stage==='prep';});
  var btn='<button class="btn" data-act="newBatch">'+svg('plus')+'دفعة جديدة</button>';
  var body=list.length?'<div class="list">'+list.map(prepCard).join('')+'</div>':
    '<div class="empty"><b>مفيش دفعات في التحضير</b><span>ابدأ دفعة جديدة والبرنامج يحسب لك المواد المطلوبة.</span><button class="btn" data-act="newBatch">'+svg('plus')+'دفعة جديدة</button></div>';
  return head('تحضير','حدد الكمية، اسحب المواد، وخلّص خطوات التجهيز',btn)+body;
}

var SEASONS=[['normal','عادي'],['ramadan','رمضان'],['mawlid','مولد النبي'],['christmas','الكريسماس'],['halloween','الهالوين']];
function seasonOf(p){return p.season||'normal';}
function curSeason(){return U.season||'normal';}
function inSeason(p){return seasonOf(p)===curSeason();}
function hiddenSeasons(){try{return JSON.parse(localStorage.getItem('khat-seasons-hidden')||'[]');}catch(e){return [];}}
function seasonHidden(k){return k!=='normal'&&hiddenSeasons().indexOf(k)>-1;}
function visibleSeasons(){return SEASONS.filter(function(x){return !seasonHidden(x[0]);});}
function ordSeason(){return seasonHidden(curSeason())?'normal':curSeason();}
function seasonSeg(current,act,list){
  return '<div class="seg wrap" style="margin:0 0 12px">'+(list||SEASONS).map(function(x){
    return '<button class="'+(current===x[0]?'on':'')+'" data-act="'+act+'" data-v="'+x[0]+'">'+x[1]+'</button>';
  }).join('')+'</div>';
}
function seasonSegHTML(){return seasonSeg(curSeason(),'setSeason');}
function recipesView(){
  var btn='<button class="btn" data-act="newProd">'+svg('plus')+'وصفة جديدة</button>';
  var list=prodsOf('cust').filter(inSeason);
  if(!list.length)return head('وصفات','اختار وصفة وشوف مراحلها ومقاديرها',btn)+seasonSegHTML()+'<div class="empty"><b>مفيش وصفات في التبويب ده</b><span>ضيف وصفة وحدّد تبويبها من الفورم.</span><button class="btn" data-act="newProd">'+svg('plus')+'وصفة جديدة</button></div>';
  var cur=list.filter(function(p){return p.id===U.rsel;})[0]||list[0];U.rsel=cur.id;
  var q=U.rqty||1;
  var opts=list.map(function(p){return '<option value="'+p.id+'"'+(p.id===cur.id?' selected':'')+'>'+p.name+'</option>';}).join('');
  var gs=cur.stages.filter(function(g){return g.kind==='prep';}).concat(cur.stages.filter(function(g){return g.kind==='finish';}));
  var blocks=gs.map(function(g,i){

function ordShort(o){
  var bs=orderBatches(o);
  return o.items.map(function(it){
    var fs=it.fs||0,have=fs+(it.got||0),pend=0,unw=0;
    bs.forEach(function(b){if(b.p===it.p){pend+=pc(b);if(!b.withdrawn)unw+=pc(b);}});
    return {p:it.p,qty:it.qty,fs:fs,have:have,pend:pend,unw:unw,short:Math.max(0,r3(it.qty-have-pend))};
  });
}
function ordComplete(o){return ordShort(o).every(function(x){return x.have>=x.qty;});}
function ordRemain(o){
  return ordShort(o).filter(function(x){return x.qty-x.have>0;}).map(function(x){return {p:x.p,qty:x.qty-x.have};});
}
function fgReserved(pid){
  var n=0;
  S.orders.forEach(function(o){
    if(o.deliveredAt)return;
    (o.items||[]).forEach(function(it){if(it.p===pid)n+=(it.fs||0)+(it.got||0);});
  });
  return r3(n);
}
function fgShortRows(){
  var out=[];
  S.orders.forEach(function(o){
    if(o.deliveredAt)return;
    ordShort(o).forEach(function(x){if(x.short>0)out.push({o:o,x:x});});
  });
  return out;
}
function rawShortList(){
  if(!TRACK())return [];
  var tot={};
  S.batches.forEach(function(b){
    if(b.withdrawn)return;
    var n=need(b);
    for(var k in n)tot[k]=r3((tot[k]||0)+n[k]);
  });
  var out=[];
  Object.keys(tot).forEach(function(k){
    var m=M(k),have=S.stock[k]||0;
    if(m&&have+1e-9<tot[k])out.push({m:m,need:tot[k],have:have,short:r3(tot[k]-have)});
  });
  return out;
}

  return '<div class="fld"><label for="f_'+key+'">'+label+'</label><input id="f_'+key+'" data-f="'+key+'" type="'+(o.type||'text')+'"'+(o.im?' inputmode="'+o.im+'"':'')+(o.ph?' placeholder="'+o.ph+'"':'')+(o.list?' list="'+o.list+'"':'')+' value="'+esc(U.form[key])+'" autocomplete="off">'+(o.hint?'<small>'+o.hint+'</small>':'')+'</div>';
}
function sel(key,label,arr){return '<div class="fld"><label for="f_'+key+'">'+label+'</label><select id="f_'+key+'" data-f="'+key+'">'+opts(arr,U.form[key])+'</select></div>';}

function prodFormHTML(){

    return '<div class="fld"><span class="sec-l">'+title+' ('+idx.length+')</span><div class="stack">'+idx.map(function(gi,n){return stageForm(F.stages[gi],gi,n,idx.length);}).join('')+'</div><button class="btn ghost sm" style="align-self:flex-start" data-act="stAdd" data-k="'+kind+'">'+svg('plus')+add+'</button></div>';

    '<datalist id="matl">'+MATERIALS.map(function(m){return '<option value="'+esc(unesc(m.name))+'">';}).join('')+'</datalist>'+

    sect('finish','مراحل الفنش','مرحلة فنش')+area();

function saveMat(F){
  var name=F.name.trim();
  if(!name){toast('اكتب اسم الصنف');return false;}
  var min=F.min===''?0:num(F.min);if(!isFinite(min)||min<0){toast('حد إعادة الطلب غير صحيح');return false;}
  var qty=F.qty===''?0:num(F.qty);if(!isFinite(qty)||qty<0){toast('الكمية غير صحيحة');return false;}
  var dup=MATERIALS.some(function(m){return m.id!==F.edit&&unesc(m.name).trim().toLowerCase()===name.toLowerCase();});
  if(dup){toast('الاسم ده موجود قبل كده');return false;}
  var o={name:esc(name),cat:esc((F.cat||'').trim()||'عام'),unit:F.unit,min:min,storage:F.storage,exp:F.exp||'',supplier:esc((F.supplier||'').trim()),notes:esc((F.notes||'').trim())};
  if(F.edit){Object.assign(M(F.edit),o);toast('تم حفظ التعديلات');}
  else{o.id='m'+Date.now().toString(36);S.materials.push(o);S.stock[o.id]=r3(qty);toast('تمت إضافة '+name);}
  U.form=null;
fsWriteRecipes();
}
function saveProd(F){
  var name=F.name.trim();
  if(!name){toast('اكتب اسم المنتج');return false;}
  var mins=num(F.mins);if(!isFinite(mins)||mins<=0){toast('اكتب وقت التشغيل بالدقائق');return false;}
  var yl=num(F.yield||'1');if(!isFinite(yl)||yl<=0){toast('اكتب عدد القطع اللي الوصفة بتطلعها');return false;}
  var stages=[],bad=null;
  F.stages.forEach(function(g){
    var gname=g.name.trim(),ings=[],seen={};
    g.ings.forEach(function(r){
      var n=(r.n||'').trim(),qs=String(r.q).trim();
      if(!n&&!qs)return;
      if(!n){bad=bad||'اكتب اسم المكوّن';return;}
      var q=num(qs);
      if(!isFinite(q)||q<=0){bad=bad||'كمية '+n+' لازم تكون أكبر من صفر';return;}
      var key=norm(n);
      if(seen[key]){bad=bad||n+' متكرر في نفس المرحلة';return;}
      seen[key]=1;ings.push({key:key,n:n,u:r.u,q:q});
    });
    var steps=g.steps.map(function(t){return t.trim();}).filter(Boolean);
    if(!gname&&!ings.length&&!steps.length)return;
    if(!gname){bad=bad||'اكتب اسم المرحلة';return;}
    stages.push({kind:g.kind,name:gname,ings:ings,steps:steps});
  });
  if(bad){toast(bad);return false;}
  if(!stages.some(function(g){return g.ings.length;})){toast('ضيف مكوّن واحد على الأقل');return false;}
  var dup=PRODUCTS.some(function(p){return p.id!==F.edit&&unesc(p.name).trim().toLowerCase()===name.toLowerCase();});
  if(dup){toast('الاسم ده موجود قبل كده');return false;}
  stages=stages.filter(function(g){return g.kind==='prep';}).concat(stages.filter(function(g){return g.kind==='finish';}));
  stages.forEach(function(g){
    g.name=esc(g.name);g.steps=g.steps.map(esc);
    g.ings=g.ings.map(function(i){
      var m=findMat(i.n);
      if(!m){
        m={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:esc(i.n),cat:'عام',unit:i.u,min:0,storage:'مخزن جاف',exp:'',supplier:'',notes:''};
        S.materials.push(m);S.stock[m.id]=0;
      }
      return {m:m.id,q:i.q};
    });
  });
  var o={name:esc(name),cat:esc((F.cat||'').trim()||'عام'),unit:(F.unit||'').trim()||'قطعة',mins:mins,yield:yl,stages:stages,notes:esc((F.notes||'').trim()),shop:!!F.shop,season:F.season||'normal'};
  if(F.edit){var cur=P(F.edit);Object.assign(cur,o);syncProd(cur);toast('تم حفظ التعديلات');}
  else{o.id='p'+Date.now().toString(36);syncProd(o);S.products.push(o);U.rsel=o.id;toast('تمت إضافة '+name);}
  U.form=null;
fsWriteRecipes();
}
function bkAgo(ts){
  if(!ts)return null;
  var m=Math.round((Date.now()-ts)/60000);
  if(m<1)return 'الآن';if(m<60)return 'منذ '+m+' دقيقة';
  var h=Math.floor(m/60);if(h<24)return 'منذ '+h+' ساعة';
  return 'منذ '+Math.floor(h/24)+' يوم';
}

/* ---------- recipe stages ---------- */
function norm(x){return String(x).trim().toLowerCase();}
function findMat(name){var n=norm(name);return MATERIALS.filter(function(m){return norm(unesc(m.name))===n;})[0];}
function stageIngText(g,qty){
  return (g.ings||[]).map(function(i){var m=M(i.m);return m?m.name+' '+f(r3(i.q*qty))+' '+m.unit:'';}).filter(Boolean).join(' · ');
}
function stageItems(p,kind,qty){
  var out=[];
  (p.stages||[]).forEach(function(g,gi){
    if(g.kind!==kind)return;
    var st=(g.steps||[]).filter(Boolean);if(!st.length)st=[g.name];
    var sub=qty?stageIngText(g,qty):'';
    st.forEach(function(t){out.push({k:kind+gi,g:g.name,sub:sub,t:t});});
  });
  return out;
}
function prepItems(p,qty){
  var a=stageItems(p,'prep',qty);
  return a.length?a:[{k:'p-1',g:'',sub:'',t:'تجهيز المواد'}];
}
function finItems(p,qty){
  return stageItems(p,'finish',qty).concat(QC.map(function(t){return {k:'qc',g:'فحص الجودة',sub:'',t:t};}));
}
function syncProd(p){
  var rec={};
  (p.stages||[]).forEach(function(g){(g.ings||[]).forEach(function(i){rec[i.m]=r3((rec[i.m]||0)+i.q);});});
  p.recipe=rec;
  p.prep=prepItems(p,0).map(function(x){return x.t;});
}
function migrateProducts(list){
  list.forEach(function(p){
    if(!p.stages){
      p.stages=[{kind:'prep',name:'التحضير',ings:Object.keys(p.recipe||{}).map(function(k){return {m:k,q:p.recipe[k]};}),steps:(p.prep||[]).slice()}];
    }
    syncProd(p);
  });
}
function chipGroups(items,ck,act,id){
  var gs=[];
  items.forEach(function(x,i){
    var l=gs[gs.length-1];
    if(!l||l.k!==x.k){l={k:x.k,g:x.g,sub:x.sub,it:[]};gs.push(l);}
    l.it.push({t:x.t,i:i});
  });
  return gs.map(function(gp){
    return (gp.g?'<div class="sgh">'+gp.g+'</div>':'')+(gp.sub?'<div class="meta">'+gp.sub+'</div>':'')+
      '<div class="chk">'+gp.it.map(function(c){
        return '<button class="chip'+(ck.indexOf(c.i)>-1?' on':'')+'" data-act="'+act+'" data-id="'+id+'" data-i="'+c.i+'"><i>'+svg('check')+'</i>'+c.t+'</button>';
      }).join('')+'</div>';
  }).join('');
}
function prepGroupsHTML(b){return chipGroups(prepItems(P(b.p),b.qty),b.checks||[],'toggleCheck',b.id);}
function stagesText(p,kind,qty){
  return (p.stages||[]).filter(function(g){return g.kind===kind;}).map(function(g,i){
    var ing=stageIngText(g,qty),st=(g.steps||[]).map(function(t,j){return (j+1)+'. '+t;}).join('<br>');
    return '<div class="sgb" style="margin-top:6px"><div class="sgh">'+(i+1)+') '+g.name+'</div>'+(ing?'<div class="meta">'+ing+'</div>':'')+(st?'<div class="meta">'+st+'</div>':'')+'</div>';
  }).join('');
}

/* ---------- printing ---------- */
function stagesPrint(p,kind,qty){
  var gs=(p.stages||[]).filter(function(g){return g.kind===kind;});
  return gs.map(function(g,i){
    var ing=(g.ings||[]).map(function(x){var m=M(x.m);return m?'<tr><td>'+m.name+'</td><td class="n">'+f(r3(x.q*qty))+' '+m.unit+'</td></tr>':'';}).join('');
    var st=(g.steps||[]).map(function(t){return '<li>'+t+'</li>';}).join('');
    return '<div class="pg"><div class="pgh">'+(i+1)+') '+g.name+'</div>'+(ing?'<table class="pt"><tbody>'+ing+'</tbody></table>':'')+(st?'<ul class="ck">'+st+'</ul>':'')+'</div>';
  }).join('');
}
function printOrderHTML(o){
  var h='<h1>طلبية '+o.id+'</h1><div class="pm">'+(o.cust?o.cust+' · ':'')+tstr(o.created)+(o.due?' · معاد التسليم: '+dueStr(o.due):'')+'</div>';
  h+='<table class="pt"><thead><tr><th>#</th><th>الصنف</th><th>الكمية</th></tr></thead><tbody>'+o.items.map(function(it,i){var p=P(it.p);return p?'<tr><td>'+(i+1)+'</td><td>'+p.name+'</td><td class="n">'+f(it.qty)+' '+p.unit+'</td></tr>':'';}).join('')+'</tbody></table>';
  return h;
}

function printMatsByStageHTML(o){
  var groups=[],idx={};
  o.items.forEach(function(it){
    var p=P(it.p);if(!p)return;
    (p.stages||[]).forEach(function(g){
      if(!(g.ings||[]).length)return;
      var key=norm(unesc(g.name)),gp=idx[key];
      if(!gp){gp=idx[key]={name:g.name,rows:[]};groups.push(gp);}
      g.ings.forEach(function(x){var m=M(x.m);if(m)gp.rows.push({m:m,q:r3(x.q*it.qty),p:p.name});});
    });
  });
  var h='<h1>الخامات حسب مرحلة التحضير</h1><div class="pm">طلبية '+o.id+(o.cust?' · '+o.cust:'')+' · '+tstr(o.created)+'</div>';

    return '<div class="pg"><h2>'+gp.name+'</h2><table class="pt"><thead><tr><th></th><th>الخامة</th><th>الكمية</th><th>المنتج</th></tr></thead><tbody>'+gp.rows.map(function(r){return '<tr><td>☐</td><td>'+r.m.name+'</td><td class="n">'+f(r.q)+' '+r.m.unit+'</td><td>'+r.p+'</td></tr>';}).join('')+'</tbody></table></div>';
  }).join('');
  return h||'<h1>مفيش خامات</h1>';
}

/* ---------- alarm: loud sound + vibration until stopped ---------- */
var AC=null,alarmTimer=null,WL=null;
function unlockAudio(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){}
}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
function beep(){
  if(!AC)return;
  try{
    if(AC.state==='suspended')AC.resume();
    var t=AC.currentTime;
    [[0,880],[.3,1175],[.6,880]].forEach(function(x){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='square';o.frequency.value=x[1];
      g.gain.setValueAtTime(.0001,t+x[0]);
      g.gain.exponentialRampToValueAtTime(1,t+x[0]+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+x[0]+.26);
      o.connect(g);g.connect(AC.destination);o.start(t+x[0]);o.stop(t+x[0]+.28);
    });
  }catch(e){}
}
function buzz(){try{if(navigator.vibrate)navigator.vibrate([500,150,500,150,500]);}catch(e){}}
function ringing(){return S.batches.some(function(b){return b.ringing;});}
function alarmTick(){if(!ringing()){stopAlarmLoop();return;}beep();buzz();}
function startAlarmLoop(){if(alarmTimer)return;alarmTick();alarmTimer=setInterval(alarmTick,1800);}
function stopAlarmLoop(){
  if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null;}
  try{if(navigator.vibrate)navigator.vibrate(0);}catch(e){}
  try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}
}
function wakeSync(){
  var need=ringing()||S.batches.some(function(b){return b.stage==='prod'&&b.startedAt&&!b.notified;});
  try{
    if(need&&!WL&&navigator.wakeLock&&!document.hidden){
      navigator.wakeLock.request('screen').then(function(l){WL=l;l.addEventListener('release',function(){WL=null;});}).catch(function(){});
    }else if(!need&&WL){WL.release();WL=null;}
  }catch(e){}
}
function alarmHTML(){
  var rs=S.batches.filter(function(b){return b.ringing;});
  if(!rs.length)return '';
  return '<div class="alarm" role="alert"><div><b>خلص الوقت</b><div>'+rs.map(function(b){var p=P(b.p);return (p?p.name:'')+' · '+b.id;}).join(' | ')+'</div></div><button data-act="stopAlarm">إيقاف</button></div>';
}

/* ---------- orders ---------- */
function orderBatches(o){return S.batches.filter(function(b){return b.o===o.id;});}
function orderNeed(items){
  var o={};
  items.forEach(function(it){var p=P(it.p);if(!p)return;for(var k in p.recipe)o[k]=r3((o[k]||0)+p.recipe[k]*it.qty);});
  return o;
}
function itemsText(o){
  return o.items.map(function(it){var p=P(it.p);return p?p.name+' ×'+f(it.qty):'';}).filter(Boolean).join(' · ');
}
function otag(b){
  var o=S.orders.filter(function(x){return x.id===b.o;})[0];
  return '<span class="pill otag" style="--p:var(--orders)">طلبية '+b.o+(o&&o.cust?' · '+o.cust:'')+'</span>';
}
function matRows(tot,rem){
  var track=TRACK();
  return Object.keys(tot).map(function(k){
    var m=M(k);if(!m)return '';
    var st='',small='';
    if(track){
      var have=S.stock[k]||0,r=rem?(rem[k]||0):tot[k];
      small='<small>المتاح '+f(have)+' '+m.unit+'</small>';
      if(rem&&!(r>0))st='<span class="pill ok">'+svg('check','mi')+' مسحوب</span>';
      else if(have+1e-9<r)st='<span class="pill bad">ينقص '+f(r-have)+'</span>';
      else st='<span class="pill ok">متوفر</span>';
    }
    return '<div class="rq"'+(track?'':' style="grid-template-columns:minmax(0,1fr) auto"')+'><div><b>'+m.name+'</b>'+small+'</div><span class="qv">'+f(tot[k])+' '+m.unit+'</span>'+st+'</div>';
  }).join('');
}
function orderCard(o){
  var bs=orderBatches(o),open=U.oexp===o.id,rows=ordShort(o),total=rows.length;
  var doneN=rows.filter(function(x){return x.have>=x.qty;}).length;
  var cnt={prep:0,prod:0,finish:0};bs.forEach(function(b){cnt[b.stage]++;});
  var tot=orderNeed(ordRemain(o));
  var rem=orderNeed(rows.filter(function(x){return x.short+x.unw>0;}).map(function(x){return {p:x.p,qty:x.short+x.unw};}));
  var lack=TRACK()?Object.keys(rem).filter(function(k){return (S.stock[k]||0)+1e-9<rem[k];}).length:0;
  var nShort=rows.filter(function(x){return x.short>0;}).length;
  var hd='<div class="bh"><div><span class="bid ltr">'+o.id+'</span><h3 class="bn">'+custName(o)+'</h3></div><span class="pill c">'+ago(o.created)+'</span></div>';
  var detail='<div><span class="meta">'+itemsText(o)+'</span><div class="meta">'+tstr(o.created)+(o.due?' · معاد التسليم <b>'+dueStr(o.due)+'</b>':'')+'</div></div>'+
    '<div class="prog"><span>خلص '+doneN+'/'+total+'</span><div class="bar"><i style="width:'+(total?doneN/total*100:0)+'%"></i></div></div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill">تحضير '+cnt.prep+'</span><span class="pill">إنتاج '+cnt.prod+'</span><span class="pill">فنش '+cnt.finish+'</span>'+
    (nShort?'<span class="pill bad">ناقص '+nShort+(nShort>1?' أصناف':' صنف')+'</span>':'')+
    (lack?'<span class="pill bad">خامات ناقصة '+lack+'</span>':'')+'</div>'+
    '<div class="btns"><button class="btn ghost sm" data-act="printOrder" data-id="'+o.id+'">طباعة الطلبية</button><button class="btn ghost sm" data-act="printMats" data-id="'+o.id+'">طباعة الخامات المطلوبة</button></div>';
  var body='';
  if(open){
    var prep=rows.map(function(x){
      var p=P(x.p);if(!p)return '';
      var st,left=x.qty-x.have,from=x.fs>0?'من المخزن '+f(x.fs)+' · ':'';
      if(left<=0) st=from+'خلص';
      else if(x.pend){
        var b=bs.filter(function(y){return y.p===x.p;})[0];
        st=from+(b.stage!=='prep'?'عدّى التحضير':(b.withdrawn?'قيد التجهيز '+(b.checks||[]).length+'/'+p.prep.length:'بانتظار سحب المواد'));
        if(x.short>0)st+=' · ناقص '+f(x.short)+' (في النواقص)';
      } else st=from+'ناقص '+f(x.short)+' · محتاج دفعة من النواقص';
      return '<div class="mrow"><div class="mtop"><div><b>'+p.name+'</b><small>'+st+'</small></div><div class="mq"><b>'+f(x.qty)+'</b> <span>'+p.unit+'</span></div></div>'+(left>0?stagesText(p,'prep',left):'')+'</div>';
    }).join('');
    var fin=rows.map(function(x){
      var p=P(x.p),left=x.qty-x.have;if(!p||left<=0)return '';
      return '<div class="mrow"><div class="mtop"><div><b>'+p.name+'</b><small>فحص: '+QC.join(' · ')+'</small></div><div class="mq"><b>'+f(left)+'</b> <span>'+p.unit+'</span></div></div>'+stagesText(p,'finish',left)+'</div>';
    }).join('');
    body='<div class="grp">التحضير المطلوب</div><div>'+prep+'</div>'+
      '<div class="grp">الخامات المطلوبة للطلبية</div><div>'+matRows(tot,rem)+'</div>'+
      '<div class="grp">الفنش المطلوب</div><div>'+fin+'</div>'+
      '<div class="foot"><button class="btn ghost sm" data-act="tab" data-v="fgstock">مخزن الإنتاج والنواقص</button><button class="btn quiet" data-act="oCancel" data-id="'+o.id+'">'+(U.confirm==='o'+o.id?'اضغط تاني للتأكيد':'إلغاء الطلبية')+'</button></div>';
  }
  return '<article class="card" style="--c:var(--orders)">'+hd+(open?detail+body:'')+'<button class="btn ghost sm block" data-act="oToggle" data-id="'+o.id+'" aria-expanded="'+(open?'true':'false')+'">'+(open?'إخفاء التفاصيل':'عرض التفاصيل')+'</button></article>';
}
function dueStr(s){return String(s||'').replace('T',' ');}
function okind(o){return o.kind||'cust';}
function custName(o){return o.cust||'أوردر بدون اسم';}
function monthKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function lockKey(kind,k){return kind+'|'+k;}
function isLocked(o){return !!(S.locks&&S.locks[lockKey(okind(o),monthKey(o.created))]);}
function prodsOf(kind){return PRODUCTS.filter(function(p){return kind==='shop'?!!p.shop:!p.shop;});}
function ordersOf(kind){return S.orders.filter(function(o){return okind(o)===kind&&(o.season||'normal')===ordSeason();});}
function openCount(kind){return ordersOf(kind).filter(function(o){return !o.deliveredAt;}).length;}
function grpTitle(t,n){return '<div class="grp">'+t+' ('+n+')</div>';}

}

    if(FS.ok||FS.granting)return false;
    if(typeof FS.h.requestPermission!=='function'){toast('المتصفح ده مش بيدعم إذن الفولدر');return false;}
    FS.granting=true;toast('بطلب إذن الفولدر...');
    FS.h.requestPermission({mode:'readwrite'}).then(function(p){
      FS.ok=p==='granted';
      if(!FS.ok){
        if(p==='denied'){
          FS.h=null;FS.err=null;
          idbSet('dirhandle',null).catch(function(){});
          toast('المتصفح رفض الوصول للفولدر. اختار الفولدر من جديد');
        }else toast('الإذن ما اتوافقش عليه (الحالة: '+p+')');
        return;
      }
      toast('تم منح الإذن');return syncFromFolder();
    }).catch(function(e){
      toast('المتصفح رفض الطلب: '+((e&&e.name)||'خطأ'));

    return false;

  settingsSubmit:function(){
    var st=sPwStored(),mode=!st?'setup':(U.sChange?'change':'unlock');
    var get=function(id){var e=document.getElementById(id);return e?e.value:'';};
    var pw=get('spw1'),c=get('spw2'),old=get('spwOld');
    if(!/^[0-9]+$/.test(pw)||(mode==='unlock'&&!pw)){U.sErr='الـ PIN أرقام بس';render();return false;}
    var ok=function(){try{sessionStorage.setItem('khat-set-ok','1');}catch(e){}U.sErr=null;U.sChange=false;render();};
    var fail=function(){U.sErr='المتصفح مش بيدعم التحقق دلوقتي، افتح الصفحة من HTTPS';render();};
    if(mode==='unlock'){
      hexPbkdf2(pw,st.salt,st.iter).then(function(h){if(h===st.hash)ok();else{U.sErr='الـ PIN غلط';render();}}).catch(fail);
      return false;
    }
    if(!/^[0-9]{4,6}$/.test(pw)){U.sErr='الـ PIN لازم يكون من 4 لـ 6 أرقام';render();return false;}
    if(pw!==c){U.sErr='التأكيد مش مطابق';render();return false;}
    if(mode==='setup'){saveSettingsPw(pw).then(ok).catch(fail);return false;}
    if(!/^[0-9]{4,6}$/.test(old)){U.sErr='الـ PIN الحالي أرقام بس';render();return false;}
    hexPbkdf2(old,st.salt,st.iter).then(function(h){
      if(h!==st.hash){U.sErr='الـ PIN الحالي غلط';render();return;}
      return saveSettingsPw(pw).then(ok);
    }).catch(fail);
    return false;
  },

});
function onField(e){
  var t=e.target,F=U.form,d=t&&t.dataset;
  if(!d)return;
  if(d.opk!==undefined&&U.osheet){U.osheet.pack=t.value;return;}
  if(d.oq!==undefined&&U.osheet){var ov=num(t.value);U.osheet.items[d.oq]=(isFinite(ov)&&ov>=0)?Math.min(99999,Math.floor(ov)):0;return;}
  if(d.stk!==undefined){var sb=batch(d.stk),v=num(t.value);sb.stk=(isFinite(v)&&v>=0)?r3(v):0;return;}
  if(d.rej!==undefined){var rb=batch(d.rej),rv=num(t.value);rb.rej=(isFinite(rv)&&rv>=0)?Math.min(pc(rb),r3(rv)):0;if(rb.stk==null){var se=document.querySelector('[data-stk="'+rb.id+'"]');if(se)se.value=pc(rb)-rb.rej;}return;}
  if(d.rs!==undefined){U.rsel=t.value;U.rqty=1;render();return;}
  if(U.osheet&&d.oc!==undefined){U.osheet.cust=t.value;return;}
  if(U.osheet&&d.od!==undefined){U.osheet.due=t.value;return;}
  if(!F)return;
  if(d.f!==undefined){F[d.f]=t.value;return;}
  if(d.gi===undefined||!F.stages)return;
  var g=F.stages[Number(d.gi)];if(!g)return;
  if(d.gf==='name'){g.name=t.value;}
  else if(d.ii!==undefined){
    var r=g.ings[Number(d.ii)];if(!r)return;
    if(d.fd==='n'){
      r.n=t.value;
      var mm=findMat(t.value);
      r.m=mm?mm.id:null;if(mm)r.u=mm.unit;
      try{
        var ln=t.closest('.iline'),su=ln&&ln.querySelector('select');
        if(su){su.value=r.u;su.disabled=!!r.m;}
      }catch(x){}
    }
    else if(d.fd==='q')r.q=t.value;
    else if(d.fd==='u')r.u=t.value;
  }
  else if(d.ti!==undefined){g.steps[Number(d.ti)]=t.value;}
}
document.addEventListener('input',onField);
document.addEventListener('change',function(e){var ds=e.target&&e.target.dataset;if(ds&&(ds.oq!==undefined||ds.opk!==undefined)){onField(e);render();return;}if(ds&&ds.rs!==undefined)onField(e);if(ds&&(ds.rej!==undefined||ds.stk!==undefined)){onField(e);save();render();}});
window.addEventListener('hashchange',function(){
  var h=(location.hash||'').slice(1);
  if(['home','orders','shopOrders','shopProducts','recipes','settings','prep','prod','stock','finish','fgstock'].indexOf(h)>-1&&h!==U.view){U.view=h;render();window.scrollTo(0,0);}
});

/* ---------- live timers ---------- */
function tick(){
  updateConn();
  var changed=false;
  S.batches.forEach(function(b){
    if(b.stage==='prod'&&b.startedAt&&!b.notified&&timerDone(b)){b.notified=true;b.ringing=true;changed=true;}
  });
  if(changed){save();render();}
  wakeSync();
  if(document.hidden||changed)return;
  var rings=document.querySelectorAll('[data-ring]');
  for(var i=0;i<rings.length;i++){
    var el=rings[i],b=batch(el.dataset.ring);
    if(!b||!b.startedAt)continue;
    el.querySelector('.rp').style.strokeDashoffset=RING*(1-elapsed(b)/dur(b));
    el.querySelector('.rt').textContent=mmss(dur(b)-elapsed(b));
  }
}
setInterval(tick,1000);
setInterval(fsTick,1000);
fsLoad();
document.addEventListener('visibilitychange',tick);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&FS.ok)syncFromFolder();});
function vvSync(){
  var vv=window.visualViewport,root=document.documentElement;
  var h=vv?vv.height:window.innerHeight,t=vv?vv.offsetTop:0;
  root.style.setProperty('--vvh',h+'px');
  root.style.setProperty('--vvb',Math.max(0,window.innerHeight-h-t)+'px');
}
if(window.visualViewport){window.visualViewport.addEventListener('resize',vvSync);window.visualViewport.addEventListener('scroll',vvSync);}
window.addEventListener('resize',vvSync);
document.addEventListener('focusin',function(e){
  var t=e.target;
  if(t&&t.matches&&t.matches('input,select,textarea'))setTimeout(function(){try{t.scrollIntoView({block:'center'});}catch(x){}},300);
});
vvSync();

render();
})();
</script>
